global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: ubuntu-pro-updates-exporter
    static_configs:
      - targets:
          - web-01:10052
          - db-01:10052
          - cache-01:10052
    relabel_configs:
      # Strip the port so the instance label matches the log labels and
      # reads like a hostname in the dashboard.
      - source_labels: [__address__]
        regex: "(.+):\\d+"
        target_label: instance
