# Self-contained demo: three deliberately outdated Ubuntu "fleet hosts"
# running the exporter against the real pro client, scraped by
# Prometheus, logs shipped to Loki, dashboard provisioned in Grafana.
#
#   docker compose up -d --build
#   open http://localhost:3000
#
# Nothing here touches or reveals real infrastructure; the hosts are
# throwaway containers with generic names.

name: ubuntu-pro-updates-demo

x-pro-host: &pro-host
  restart: unless-stopped
  labels:
    demo.role: pro-host

services:
  web-01:
    <<: *pro-host
    build:
      context: ../..
      dockerfile: examples/demo/Dockerfile
      args:
        BASE_IMAGE: ubuntu:jammy-20230308
        EXTRA_PACKAGES: nginx curl
    hostname: web-01

  db-01:
    <<: *pro-host
    build:
      context: ../..
      dockerfile: examples/demo/Dockerfile
      args:
        BASE_IMAGE: ubuntu:focal-20230301
        EXTRA_PACKAGES: postgresql
    hostname: db-01
    environment:
      DEMO_REBOOT_REQUIRED: "1"

  cache-01:
    <<: *pro-host
    build:
      context: ../..
      dockerfile: examples/demo/Dockerfile
      args:
        BASE_IMAGE: ubuntu:noble-20240605
        EXTRA_PACKAGES: redis-server
    hostname: cache-01

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    # Loopback only: the demo grants no auth anywhere, so nothing may
    # listen on shared networks.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus-alerts.yml:/etc/prometheus/rules/ubuntu-pro-updates.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.5.0
    restart: unless-stopped
    volumes:
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.5.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/positions

  # Grafana's file provisioning cannot resolve the dashboard's
  # ${DS_PROMETHEUS}/${DS_LOKI} import inputs, so pin them to the
  # provisioned datasource UIDs before handing the file over.
  dashboard-init:
    image: alpine:3.21
    volumes:
      - ../grafana-dashboard-fleet.json:/in/grafana-dashboard-fleet.json:ro
      - ../grafana-dashboard-host.json:/in/grafana-dashboard-host.json:ro
      - grafana-dashboards:/out
    command: sh -c "rm -f /out/*.json; for f in /in/*.json; do sed -e 's/$${DS_PROMETHEUS}/prometheus/g' -e 's/$${DS_LOKI}/loki/g' \"$$f\" > \"/out/$$(basename \"$$f\")\"; done"

  grafana:
    image: grafana/grafana:12.2.0
    restart: unless-stopped
    depends_on:
      dashboard-init:
        condition: service_completed_successfully
    # Loopback only: anonymous admin must never be reachable from the
    # network the laptop happens to sit on.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus-data:
  loki-data:
  grafana-dashboards:
  promtail-positions:
